name: Checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up caches
        uses: ferna-works/devenv-cache@main

      - name: Check
        run: devenv shell --no-reload -- just check

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up caches
        uses: ferna-works/devenv-cache@main

      - name: Test
        run: devenv shell --no-reload -- just test
